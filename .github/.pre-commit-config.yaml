repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: [--config, .github/cicd/pyproject.toml, --fix]
      - id: ruff-format
        args: [--config, .github/cicd/pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--config-file, .github/cicd/pyproject.toml]
        additional_dependencies:
          - homeassistant
          - paho-mqtt
          - aiohttp
          - types-PyYAML
        exclude: ^(tests/|docs/)
