name: Setup CI Python
description: Set up Python, upgrade pip, and install shared CI dependencies.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  requirements-file:
    description: Optional requirements file to install and cache against
    required: false
    default: ".github/cicd/requirements-dev.txt"
  extra-packages:
    description: Optional extra packages to install after the requirements file
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python with dependency cache
      if: ${{ inputs.requirements-file != '' }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Set up Python without dependency cache
      if: ${{ inputs.requirements-file == '' }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip

    - name: Install requirements
      if: ${{ inputs.requirements-file != '' }}
      shell: bash
      run: python -m pip install -r "${{ inputs.requirements-file }}"

    - name: Install extra packages
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      run: python -m pip install ${{ inputs.extra-packages }}
