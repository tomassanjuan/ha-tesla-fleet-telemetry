name: Run CI Pipeline
description: Run the repository's CI checks in a single composite action.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up CI Python
      uses: ./.github/actions/setup-ci-python
      with:
        python-version: ${{ inputs.python-version }}
        extra-packages: "yamllint pip-audit"

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
      with:
        extra_args: --config .github/.pre-commit-config.yaml --all-files

    - name: Validate JSON & manifest
      shell: bash
      run: python .github/cicd/validate_files.py

    - name: Validate YAML
      shell: bash
      run: yamllint -c .github/.yamllint.yml .

    - name: Run hassfest
      uses: home-assistant/actions/hassfest@master

    - name: Run tests
      shell: bash
      run: |
        pytest -c .github/cicd/pyproject.toml tests/ -v \
          --cov=custom_components/tesla_fleet_telemetry \
          --cov-report=term-missing --cov-report=xml

    - name: Run pip-audit for CVE detection
      shell: bash
      run: pip-audit --desc
