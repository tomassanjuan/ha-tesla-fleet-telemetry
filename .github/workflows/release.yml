name: Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.1)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.13.2"
      - name: Run Ruff checks
        run: ruff check --config .github/cicd/pyproject.toml custom_components/tesla_fleet_telemetry/
      - name: Run format check
        run: ruff format --config .github/cicd/pyproject.toml --check custom_components/tesla_fleet_telemetry/
      - name: Run type checking
        run: mypy --config-file .github/cicd/pyproject.toml custom_components/tesla_fleet_telemetry/
      - name: Validate JSON files and manifest
        run: |
          EXPECTED_VERSION=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            EXPECTED_VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -n "$EXPECTED_VERSION" ]; then
            python .github/cicd/validate_files.py --expected-version "$EXPECTED_VERSION"
          else
            python .github/cicd/validate_files.py
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
