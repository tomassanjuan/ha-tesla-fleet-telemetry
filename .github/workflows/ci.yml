name: CI

"on":
  push:
    branches: [main, develop]
    paths:
      - "custom_components/tesla_fleet_telemetry/**"
      - "tests/**"
      - ".github/cicd/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/.yamllint.yml"
      - ".github/.pre-commit-config.yaml"
      - "hacs.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "custom_components/tesla_fleet_telemetry/**"
      - "tests/**"
      - ".github/cicd/**"
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".github/.yamllint.yml"
      - ".github/.pre-commit-config.yaml"
      - "hacs.json"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extra-packages: "yamllint"
      - name: Cache pre-commit envs
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.PYTHON_VERSION }}|${{ hashFiles('.github/.pre-commit-config.yaml') }}
      - name: Run pre-commit
        shell: bash
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --config .github/.pre-commit-config.yaml --all-files
      - name: Validate JSON & manifest
        shell: bash
        run: python .github/cicd/validate_files.py
      - name: Validate YAML
        shell: bash
        run: yamllint -c .github/.yamllint.yml .

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run tests
        shell: bash
        run: |
          pytest -c .github/cicd/pyproject.toml tests/ -v \
            --cov=custom_components/tesla_fleet_telemetry \
            --cov-report=term-missing --cov-report=xml

  pip-audit:
    name: CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          extra-packages: "pip-audit"
      - name: Run pip-audit for CVE detection
        shell: bash
        run: pip-audit -r .github/cicd/requirements-security.txt --desc
